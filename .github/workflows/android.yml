name: Ja.i Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Kaynak ZIP dosyasını aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Ja_i_Android_1_0_1_Kaynak_guvenliksiz.zip"

          test -f "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "HATA: gradlew dosyası bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: APK derle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Ja-i-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
